apiVersion: apps/v1
kind: Deployment
metadata:
  name: redbook
spec:
  replicas: 3
  selector:
    matchLabels:
      app: redbook
  template:
    metadata:
      labels:
        app: redbook
    spec:
      containers:
        - name: redbook
          image: redbook:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql:3306/redbook?allowPublicKeyRetrieval=true&useSSL=false
            - name: SPRING_DATASOURCE_USERNAME
              value: root
            - name: SPRING_DATASOURCE_PASSWORD
              value: password

---
apiVersion: v1
kind: Service
metadata:
  name: redbook-service
spec:
  type: NodePort
  selector:
    app: redbook
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080


# ---------- MySQL Deployment ----------
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
spec:
  selector:
    matchLabels:
      app: mysql
  replicas: 1
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: password
            - name: MYSQL_DATABASE
              value: redbook
          volumeMounts:
            - name: mysql-pv
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-pv
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: mysql
spec:
  ports:
    - port: 3306
  selector:
    app: mysql
  clusterIP: None